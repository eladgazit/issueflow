[project]
name = "issueflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["kafka-python-ng>=2.2"]
[project.optional-dependencies]
test = ["pytest"]
[project.scripts]
issueflow = "issueflow.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
