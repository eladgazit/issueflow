# Single-broker Apache Kafka in KRaft mode (no ZooKeeper) for issueflow.
#   docker compose up -d     start Kafka and create the topic
#   docker compose stop      stop, keep the data
#   docker compose down -v   stop and erase the data
services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: issueflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # One-shot: create the topic with ONE partition so issues keep their order.
  # Shares the broker's network so "localhost:9092" works from inside this container.
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: issueflow-kafka-init
    network_mode: "service:kafka"
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    command: >
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092
      --create --if-not-exists --topic issueflow.issues
      --partitions 1 --replication-factor 1

volumes:
  kafka-data:
